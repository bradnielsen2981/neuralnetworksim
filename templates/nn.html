<div class="container-fluid py-4">
  <div class="row">
    <!-- Left: Canvas (2/3 width) -->
    <div class="col-md-8 mb-4">
      <div class="card">
        <div class="card-header neural-network-header">
          <div class="nn-controls-row">
            <div class="controls">
              <span class="nnheading">Model</span>
              <label>Hidden Layers: <input class="centre" type="number" id="layers" min="1" max="4" value="1"></label>
              <label>Activation:
                <select id="activation">
                  <option value="relu">ReLU</option>
                  <option value="sigmoid">Sigmoid</option>
                  <option value="tanh">TanH</option>
                </select>
              </label>
              <label>Initialization:
                <select id="initialization">
                  <option value="glorot">Glorot</option>
                  <option value="standard">Standard</option>
                  <option value="random">Random</option>
                </select>
              </label>
              <div class="btn-group" role="group">
                <button id="reinitButton" class="btn btn-success btn-sm" aria-label="Reinitialise Network" title="Reinitialise Network">
                  <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
                  <span class="visually-hidden">Reinitialise Network</span>
                </button>
                <button id="resetButton" class="btn btn-danger btn-sm" aria-label="Start Over" title="Start Over" style="margin-left:5px;">
                  <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                  <span class="visually-hidden">Start Over</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="card-body neural-network-body">
          
          <div id="canvasContainer">
            <canvas id="networkCanvas" style="width:100%;max-width:100%;border:1px solid #ccc;border-radius:4px;background:#fff;"></canvas>
          </div>
          <p class="mt-2 small text-muted">For more complex patterns, a greater number of neurons and hidden layers are required. The number of Epochs must also be adjusted accordingly.</p>
        </div>
      </div>
    </div>
    <!-- Right: Neural Network Parameters Form (1/3 width) -->
    <div class="col-md-4">
      <div class="card neural-network-card">
        <div class="card-header">
          <span class="nnheading"><i class="fa-solid fa-sliders"></i> Neural Network Parameters</span>
        </div>
        <div class="card-body">
          <form id="nn-parameters-form" class="mt-2">
            <div class="mb-2">
              <label for="lossfunction" class="form-label">Loss Function
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Measures fit. Mean Squared Error (MSE) is the mean of the squared distance between the predicted point and the actual point; lower is better."></i>
              </label>
              <input type="text" id="lossfunction" class="form-control" value="Mean Squared Error" readonly>
            </div>
            <div class="mb-2">
              <label for="learning-rate" class="form-label">Learning Rate
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Fraction of the gradient used for each update; too high can diverge or skip the minimum, too low trains slowly."></i>
              </label>
              <input type="number" id="learning-rate" class="form-control" step="0.001" value="0.01">
            </div>
            <div class="mb-2">
              <label for="momentum" class="form-label">Momentum
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Adds a fraction of the previous update to smooth and speed learning."></i>
              </label>
              <div class="d-flex align-items-center">
                <input type="range" id="momentum" class="form-range" min="0" max="1" step="0.1" value="0.0">
                <span id="momentum-display" class="ms-2 small text-muted" style="min-width:3ch; text-align:right;">0.0</span>
              </div>
            </div>
            <div class="mb-2">
              <label for="epochs" class="form-label">Epochs
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="The number of passes through all the data whilst applying gradient descent to the model."></i>
              </label>
              <input type="number" id="epochs" class="form-control" value="500">
            </div>
            <div class="mb-2">
              <label for="earlystopping" class="form-label">Early Stopping
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Stop when improvement becomes too small; this sets the minimum improvement counted as progress."></i>
              </label>
              <input type="number" id="earlystopping" class="form-control" value="0.01">
            </div>
            <div class="mb-2">
              <label for="patience" class="form-label">Patience
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="How many epochs with no (or tiny) improvement are allowed before stopping early."></i>
              </label>
              <input type="number" id="patience" class="form-control" value="50">
            </div>
            <button type="button" id="train-btn" class="btn btn-primary mt-2 w-100">Train</button>
            
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  // Initialize and live-update the momentum display from the slider
  document.addEventListener('DOMContentLoaded', function () {
    const slider = document.getElementById('momentum');
    const display = document.getElementById('momentum-display');
    if (slider && display) {
      const fmt = v => Number(v).toFixed(1);
      display.textContent = fmt(slider.value);
      slider.addEventListener('input', () => display.textContent = fmt(slider.value));
    }
  });
</script>
