<div class="container-fluid py-4">
  <div class="row">
    <!-- Left: Canvas (2/3 width) -->
    <div class="col-md-8 mb-4">
      <div class="card">
        <div class="card-header neural-network-header">
          <div class="nn-controls-row">
            <div class="controls">
              <span class="nnheading">Model</span>
              <label>
                Hidden Layers
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Number of hidden layers between input and output; more layers increase capacity to learn complex patterns but may overfit and train slower."></i>
                <input class="centre" type="number" id="layers" min="1" max="4" value="1">
              </label>
              <label>
                Activation
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Activation tells each neuron how much to fire. Types: ReLU — negatives become 0, positives pass through; Sigmoid — squeezes values to 0–1; TanH — squeezes values to -1–1 and centers around 0."></i>
                <select id="activation">
                  <option value="relu">ReLU</option>
                  <option value="sigmoid">Sigmoid</option>
                  <option value="tanh">TanH</option>
                </select>
              </label>
              <label>
                Initialization
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Initialization sets the starting weights and biases before training. Types: Glorot (Xavier) — balanced random that usually trains well; Standard — bell‑curve random around 0; Random — picks numbers between -1 and 1."></i>
                <select id="initialization">
                  <option value="glorot">Glorot</option>
                  <option value="standard">Standard</option>
                  <option value="random">Random</option>
                </select>
              </label>
              <div class="btn-group" role="group">
                <button id="reinitButton" class="btn btn-success btn-sm" aria-label="Reinitialise Network" title="Reinitialise Network">
                  <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
                  <span class="visually-hidden">Reinitialise Network</span>
                </button>
                <button id="resetButton" class="btn btn-danger btn-sm" aria-label="Start Over" title="Start Over" style="margin-left:5px;">
                  <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                  <span class="visually-hidden">Start Over</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="card-body neural-network-body">
          
          <div id="canvasContainer">
            <canvas id="networkCanvas" style="width:100%;max-width:100%;border:1px solid #ccc;border-radius:4px;background:#fff;"></canvas>
          </div>
          <p class="mt-2 small text-muted">For more complex patterns, a greater number of neurons and hidden layers are required. The number of Epochs must also be adjusted accordingly.</p>
        </div>
      </div>
    </div>
    <!-- Right: Neural Network Parameters Form (1/3 width) -->
    <div class="col-md-4">
      <div class="card neural-network-card">
        <div class="card-header">
          <span class="nnheading"><i class="fa-solid fa-sliders"></i> Neural Network Parameters</span>
        </div>
        <div class="card-body">
          <form id="nn-parameters-form" class="mt-2">
            <div class="mb-2">
              <label for="lossfunction" class="form-label">Loss Function
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Measures fit. Mean Squared Error (MSE) is the mean of the squared distance between the predicted point and the actual point; lower is better."></i>
              </label>
              <input type="text" id="lossfunction" class="form-control" value="Mean Squared Error" readonly>
            </div>
            <div class="mb-2">
              <label for="learning-rate" class="form-label">Learning Rate
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Fraction of the gradient used for each update; too high can diverge or skip the minimum, too low trains slowly."></i>
              </label>
              <input type="number" id="learning-rate" class="form-control" step="0.001" value="0.01" min="0.001" max="0.1">
            </div>
            <div class="mb-2">
              <label for="momentum" class="form-label">Momentum
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Adds a fraction of the previous update to smooth and speed learning."></i>
              </label>
              <div class="d-flex align-items-center">
                <input type="range" id="momentum" class="form-range" min="0" max="1" step="0.1" value="0.0">
                <span id="momentum-display" class="ms-2 small text-muted" style="min-width:3ch; text-align:right;">0.0</span>
              </div>
            </div>
            <div class="mb-2">
              <label for="epochs" class="form-label">Epochs
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="The number of passes through all the data whilst applying gradient descent to the model."></i>
              </label>
              <input type="number" id="epochs" class="form-control" value="500" min="1" max="5000" step="1">
            </div>
            <div class="mb-2">
              <label for="earlystopping" class="form-label">Early Stopping
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="Stop when improvement becomes too small; this sets the minimum improvement counted as progress."></i>
              </label>
              <input type="number" id="earlystopping" class="form-control" value="0.01" min="0" max="5" step="0.001">
            </div>
            <div class="mb-2">
              <label for="patience" class="form-label">Patience
                <i class="fa-solid fa-circle-question ms-1 param-help" style="cursor:help;" title="How many epochs with no (or tiny) improvement are allowed before stopping early."></i>
              </label>
              <input type="number" id="patience" class="form-control" value="50" min="10" max="500">
            </div>
            <button type="button" id="train-btn" class="btn btn-primary mt-2 w-100">Train</button>
            
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  // Initialize and live-update the momentum display from the slider
  document.addEventListener('DOMContentLoaded', function () {
    const slider = document.getElementById('momentum');
    const display = document.getElementById('momentum-display');
    if (slider && display) {
      const fmt = v => Number(v).toFixed(1);
      display.textContent = fmt(slider.value);
      slider.addEventListener('input', () => display.textContent = fmt(slider.value));
    }

    // Clamp epochs on blur to [1, 5000]
    const epochsInput = document.getElementById('epochs');
    if (epochsInput) {
      const clampEpochs = () => {
        let v = parseInt(epochsInput.value, 10);
        if (!Number.isFinite(v)) v = 1;
        if (v < 1) v = 1;
        if (v > 5000) v = 5000;
        epochsInput.value = String(v);
      };
      // Removed real-time clamping; allow free typing, clamp on blur only
      epochsInput.addEventListener('blur', clampEpochs);
    }

    // Clamp learning rate on blur to [0.001, 0.1]
    const lrInput = document.getElementById('learning-rate');
    if (lrInput) {
      const clampLR = () => {
        let v = parseFloat(lrInput.value);
        if (!Number.isFinite(v)) v = 0.01;
        if (v < 0.001) v = 0.001;
        if (v > 0.1) v = 0.1;
        lrInput.value = String(v);
      };
      // Removed real-time clamping; allow free typing, clamp on blur only
      lrInput.addEventListener('blur', clampLR);
    }

    // When Activation is TanH or Sigmoid, set LR to 0.001
    const activationSelect = document.getElementById('activation');
    if (activationSelect && lrInput) {
      const maybeAdjustLR = () => {
        const val = String(activationSelect.value || '').toLowerCase();
        if (val === 'tanh' || val === 'sigmoid') {
          lrInput.value = '0.001';
        }
      };
      activationSelect.addEventListener('change', maybeAdjustLR);
      // Also run once on load to apply if default is TanH/Sigmoid
      maybeAdjustLR();
    }

    // Clamp patience on blur to [10, 500]
    const patienceInput = document.getElementById('patience');
    if (patienceInput) {
      const clampPatience = () => {
        let v = parseInt(patienceInput.value, 10);
        if (!Number.isFinite(v)) v = 10;
        if (v < 10) v = 10;
        if (v > 500) v = 500;
        patienceInput.value = String(v);
      };
      // Removed real-time clamping; allow free typing, clamp on blur only
      patienceInput.addEventListener('blur', clampPatience);
    }

    // Clamp early stopping on blur to [0, 5]
    const esInput = document.getElementById('earlystopping');
    if (esInput) {
      const clampES = () => {
        let v = parseFloat(esInput.value);
        if (!Number.isFinite(v)) v = 0;
        if (v < 0) v = 0;
        if (v > 5) v = 5;
        esInput.value = String(v);
      };
      // Removed real-time clamping; allow free typing, clamp on blur only
      esInput.addEventListener('blur', clampES);
    }
  });
</script>
