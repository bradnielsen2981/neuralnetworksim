<!-- Training Popup Modal (Flask include) -->
<div id="training-modal" class="modal" tabindex="-1" style="display:none; position:fixed; z-index:1050; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.3);">
	<div class="modal-dialog" style="margin:10vh auto; max-width:800px;">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Training</h5>
				<button type="button" class="btn-close" id="close-training-modal" aria-label="Close"></button>
			</div>
			<div class="modal-body" id="training-modal-body">
				<p>Training in progress...</p>
                <div id="training-time" class="text-muted" style="font-size:0.9rem;">
                    Time elapsed: <span id="training-elapsed">00:00.0</span>
                </div>
				 <!-- Make canvas shorter to reduce overall modal height while keeping width -->
				<canvas id="lossChart" style="width:100%; height:120px;"></canvas>
			</div>
		</div>
	</div>
</div>
