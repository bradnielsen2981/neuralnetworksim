<!-- Training Popup Modal (Flask include) -->
<div id="training-modal" class="modal" tabindex="-1" style="display:none; position:fixed; z-index:1050; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.3);">
	<div class="modal-dialog" style="margin:10vh auto; max-width:400px;">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Training</h5>
				<button type="button" class="btn-close" id="close-training-modal" aria-label="Close"></button>
			</div>
			<div class="modal-body" id="training-modal-body">
				<p>Training in progress...<br>
				You can add more details here, such as a progress bar, logs, or results.</p>
			</div>
		</div>
	</div>
</div>
